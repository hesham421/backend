# JasperReports font extension: registers the "ERP Arabic" family (reports/fonts/fonts.xml).
# JasperReports reads every jasperreports_extension.properties on the classpath; the registry id "erp.fonts"
# and the family-file key "erp" keep these entries apart from other jars'.
net.sf.jasperreports.extension.registry.factory.erp.fonts=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.erp=reports/fonts/fonts.xml
