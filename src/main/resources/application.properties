# =====================================================================
# ERP System — base configuration (common to every profile)
# Profile-specific values (datasource, redis, mail, logging) live in
# application-dev.properties / application-prod.properties. Activate a
# profile with SPRING_PROFILES_ACTIVE=dev (see .env.example) or, in Docker,
# --spring.profiles.active=prod (see Dockerfile).
# =====================================================================

spring.application.name=erp-system

# --- Server -----------------------------------------------------------
# 7272 is the contract: Docker EXPOSE, OpenApiConfig's default, and the
# TestSprite governance all assume it. Do not change without updating those.
server.port=7272
server.shutdown=graceful

# --- JPA / Hibernate --------------------------------------------------
# HibernateJpaAutoConfiguration is excluded in ErpMainApplication; the custom
# JpaConfig reads these placeholders (see JpaConfig's @Value defaults).
# Schema is owned by Flyway, so Hibernate never generates DDL (ddl-auto=none).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway (DB migrations) ------------------------------------------
# Migrations live in src/main/resources/db/migration (classpath:db/migration).
# baseline-on-migrate lets Flyway adopt a non-empty database cleanly; with no
# migration files yet (clean start) Flyway simply finds nothing and no-ops.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Actuator (health only — used by the Docker healthcheck & TestSprite) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
# Do not let an optional cache backend being down mark the whole app unhealthy.
management.health.redis.enabled=false

# --- Cache (Redis-backed when a Redis is reachable) -------------------
spring.cache.type=redis

# --- Internationalization (i18n/messages*.properties) ----------------
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- OpenAPI / Swagger UI --------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- JWT (consumed by the SECURITY module) ---------------------------
# access token TTL drives TokenResponse.expiresIn; refresh TTL is the config
# counterpart to RefreshTokenDomain's rotating-refresh policy default (7d).
app.jwt.secret=${JWT_SECRET:dev-only-secret-minimum-256-bits-long-do-not-use-in-prod}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# --- FILE access token (RULE-FILE-003 — AES/GCM download token, separate from JWT) --
# Secret is SHA-256-derived into a 256-bit AES key by FileAccessTokenDomainService.
file.access-token.secret=${FILE_ACCESS_TOKEN_SECRET:dev-only-file-token-secret-minimum-256-bits-do-not-use-in-prod}

# --- Multipart uploads (API-FILE-001) --------------------------------
# Set GENEROUSLY above the RULE-FILE-001 business limits (content ≤5MB, request ≤10MB) so the
# domain size check (FileValidationDomainService → ERR-0001, 413) is what rejects oversize files,
# not Spring's own MaxUploadSizeExceededException.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB

# --- JSON (global Jackson policy — no per-controller ObjectMapper) ---
# Jackson 3 (Boot 4) removed SerializationFeature.WRITE_DATES_AS_TIMESTAMPS; dates
# now serialize as ISO-8601 strings by default, so no property is needed.
spring.jackson.deserialization.fail-on-unknown-properties=false
