USER_ACCOUNT_INVALID_STATUS_TRANSITION=لا يمكن تغيير حالة الحساب من {0} إلى {1}.
REFRESH_TOKEN_EXPIRED=انتهت صلاحية رمز التجديد.
REFRESH_TOKEN_REVOKED=رمز التجديد غير صالح أو مُدوَّر.
PASSWORD_RESET_TOKEN_EXPIRED=انتهت صلاحية رمز إعادة التعيين.
PASSWORD_RESET_TOKEN_USED=رمز إعادة التعيين غير صالح أو مُستخدَم.
ACCOUNT_ACTIVATION_TOKEN_EXPIRED=انتهت صلاحية رمز التفعيل.
ACCOUNT_ACTIVATION_TOKEN_USED=رمز التفعيل غير صالح أو مُستخدَم.
LOOKUP_KEY_NOT_FOUND=العنصر غير موجود.

# --- Security (SEC) — two-tier RBAC Tier-1 / module registry (SVC-API-MODULES) --
