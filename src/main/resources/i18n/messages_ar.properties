APP_CONFIGURATION_FIELDS_REQUIRED=مفتاح الإعداد وقيمته إلزاميان.
APP_CONFIGURATION_KEY_IMMUTABLE=لا يمكن تعديل مفتاح الإعداد بعد إنشائه.
APP_CONFIGURATION_NOT_FOUND=الإعداد غير موجود.

# --- Security (SEC) — user management error codes (SVC-API-USERS) ------
