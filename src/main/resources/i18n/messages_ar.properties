USER_ACCOUNT_EMAIL_DUPLICATE=البريد مستخدَم مسبقاً.
USER_ACCOUNT_NOT_FOUND=العنصر غير موجود.

# --- Security (SEC) — authentication error codes (SVC-API-AUTH) --------
USER_ACCOUNT_INVALID_CREDENTIALS=بيانات الدخول غير صحيحة.
USER_ACCOUNT_LOGIN_NOT_ACTIVE=لا دخول لحساب غير نشط.
