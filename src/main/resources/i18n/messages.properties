# Shared i18n bundle (default locale = English) — see spring.messages.basename=i18n/messages.
# Module-specific error codes live in each module's own error-code bundle entries, appended
# below this shared section — never a separate bundle file (spring.messages.basename is
# single-based, so Spring merges every module's keys into this one file/locale pair).

# --- Generic Bean Validation keys (used by every module's DTOs) -------
validation.required=This field is required
validation.size=The value length is out of the allowed range
validation.invalid=The value is invalid
validation.min=The value is below the minimum allowed
validation.max=The value exceeds the maximum allowed
validation.pattern=The value does not match the required format

# --- Common platform error codes (shared across modules) --------------
INTERNAL_ERROR=An unexpected error occurred. Please try again later.

# --- Common Utils (CU) — ENTITY-CU-001 AppConfiguration error codes -----
APP_CONFIGURATION_KEY_DUPLICATE=Configuration key already exists — choose a unique key.
APP_CONFIGURATION_FIELDS_REQUIRED=Config key and value are required.
APP_CONFIGURATION_KEY_IMMUTABLE=Config key cannot be changed after creation.
APP_CONFIGURATION_NOT_FOUND=Configuration not found.

# --- Security (SEC) — user management error codes (SVC-API-USERS) ------
USER_ACCOUNT_FIELDS_REQUIRED=Core account fields required.
USER_ACCOUNT_USERNAME_DUPLICATE=Username already exists.
USER_ACCOUNT_EMAIL_DUPLICATE=Email already exists.
USER_ACCOUNT_NOT_FOUND=Resource not found.

# --- Security (SEC) — authentication error codes (SVC-API-AUTH) --------
USER_ACCOUNT_INVALID_CREDENTIALS=Invalid credentials.
USER_ACCOUNT_LOGIN_NOT_ACTIVE=Login blocked for non-active account.
USER_ACCOUNT_LOCKED=Locked after failed logins.
USER_ACCOUNT_PASSWORD_COMPLEXITY=Password complexity not met.
USER_ACCOUNT_PASSWORD_NOT_HASHED=Password must be stored hashed.
USER_ACCOUNT_INVALID_STATUS_TRANSITION=Cannot change account status from {0} to {1}.
REFRESH_TOKEN_EXPIRED=Refresh token has expired.
REFRESH_TOKEN_REVOKED=Refresh token invalid or rotated.
PASSWORD_RESET_TOKEN_EXPIRED=Reset token has expired.
PASSWORD_RESET_TOKEN_USED=Reset token invalid or already used.
ACCOUNT_ACTIVATION_TOKEN_EXPIRED=Activation token has expired.
ACCOUNT_ACTIVATION_TOKEN_USED=Activation token invalid or already used.
LOOKUP_KEY_NOT_FOUND=Resource not found.

# --- Security (SEC) — two-tier RBAC Tier-1 / module registry (SVC-API-MODULES) --
MODULE_CODE_DUPLICATE=Code must be unique.
MODULE_FIELDS_REQUIRED=Module code and names are required.
MODULE_NOT_FOUND=Resource not found.
ROLE_NOT_FOUND=Resource not found.
ROLE_MODULE_REVOKE_HAS_DEPENDENTS=Cannot revoke module: role still holds screen permissions within it.

# --- Security (SEC) — RBAC roles / pages / permissions / Tier-2 grants (SVC-API-RBAC) --
ROLE_CODE_DUPLICATE=Code must be unique.
ROLE_FIELDS_REQUIRED=Role code and names are required.
PAGE_CODE_DUPLICATE=Code must be unique.
PAGE_FIELDS_REQUIRED=Page code, names and owning module are required.
PERMISSION_CODE_DUPLICATE=Code must be unique.
ROLE_PERMISSION_MODULE_NOT_GRANTED=Screen permission requires the role to hold the page's module.
PAGE_NOT_FOUND=Resource not found.
PERMISSION_NOT_FOUND=Resource not found.

# --- Master Data (MDM) — reference-data lookup error codes (DATA-DOM) --
LOOKUP_TYPE_FIELDS_REQUIRED=Both the Arabic name and the English name are required.
LOOKUP_TYPE_CODE_DUPLICATE=This type code already exists — choose a unique code.
LOOKUP_TYPE_HAS_ACTIVE_VALUES=Items are deactivated, not deleted; a type that still has values cannot be hard-deleted.
LOOKUP_VALUE_FIELDS_REQUIRED=Both the Arabic name and the English name are required.
LOOKUP_VALUE_CODE_DUPLICATE=This value code already exists under this type — choose a unique code.
LOOKUP_TYPE_NOT_FOUND=LookupType not found.
LOOKUP_VALUE_NOT_FOUND=LookupValue not found.
LOOKUP_TYPE_PARENT_NOT_FOUND=Parent LookupType not found.

# --- Notification Service (NOTIF) — domain-layer error codes (DATA-DOM) --
NOTIF_TEMPLATE_BILINGUAL_REQUIRED=Bilingual template body required.
NOTIF_TEMPLATE_CODE_DUPLICATE=Template code must be unique.
NOTIF_CHANNEL_CONFIG_DUPLICATE=Channel config must be unique.
NOTIF_CHANNEL_TYPE_REQUIRED=Channel type code is required.
NOTIF_TEMPLATE_INACTIVE=Notification template ''{0}'' is inactive and cannot be dispatched.
NOTIF_LOG_INVALID_TRANSITION=Invalid notification status transition from ''{0}'' to ''{1}''.

# --- Notification Service (NOTIF) — SVC-API not-found / lookup codes (ERR-0004) --
NOTIF_TEMPLATE_NOT_FOUND=Notification template not found.
NOTIF_CHANNEL_CONFIG_NOT_FOUND=Notification channel config not found.
NOTIF_LOG_NOT_FOUND=Notification log not found.
NOTIF_LOOKUP_KEY_UNKNOWN=Unknown lookup key ''{0}''.

# --- File Service (FILE) — domain-layer error codes (DATA-DOM) --
FILE_DOCUMENT_SIZE_EXCEEDED=File exceeds allowed size ({0} bytes exceeds {1}).
FILE_DOCUMENT_TYPE_NOT_ALLOWED=File type ''{0}'' is not allowed.
FILE_ACCESS_TOKEN_INVALID=Access link is invalid or expired.
FILE_DOCUMENT_OWNERSHIP_REQUIRED=Ownership fields are required.
FILE_CATEGORY_CODE_DUPLICATE=Category code ''{0}'' already exists.
FILE_CATEGORY_INACTIVE=File category {0} is inactive and cannot be used.
FILE_LOOKUP_KEY_UNKNOWN=Unknown lookup key ''{0}''.
FILE_DOCUMENT_INVALID_TRANSITION=Invalid file status transition from ''{0}'' to ''{1}''.

# --- File Service (FILE) — SVC-API not-found codes (ERR-0006 PLATFORM-STD) --
FILE_DOCUMENT_NOT_FOUND=File with ID {0} was not found.
FILE_CATEGORY_NOT_FOUND=File category with ID {0} was not found.
