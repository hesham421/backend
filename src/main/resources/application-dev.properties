# =====================================================================
# ERP System — DEV profile (local development)
# Activated by SPRING_PROFILES_ACTIVE=dev (.env.example). Every value falls
# back to the docker/docker-compose.yml defaults, so `docker compose up -d`
# then running the app needs zero .env edits.
# =====================================================================

# --- Datasource (PostgreSQL) -----------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erp_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Redis (cache) ----------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Mail (Gmail SMTP; app password, see .env.example) ---------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Frontend (used to build clickable links in emails, e.g. password reset) ------
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# --- Dev conveniences -------------------------------------------------
spring.jpa.show-sql=true
management.endpoint.health.show-details=always

# --- Logging ----------------------------------------------------------
logging.level.com.erp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO
