# =====================================================================
# erp — production stack on the shared server (89.117.37.75).
#
# In-place update of the EXISTING production containers: same names
# (erp-backend, erp-frontend), same host networking, same ports
# (backend 7272, frontend nginx 80). The database is NOT part of this
# stack: postgres-db (~/postgres, volume erp-postgres-data) is reached on
# localhost:5432 and is never recreated by this file.
# Not touched either: erp-fin-consumer, oracle, mxerp-*, host nginx, ...
#
# Laid out on the server by deployment/deploy.py as:
#   ~/erp-deploy/{docker-compose.yml,.env,backend/,frontend/}
# Always run as: docker compose -p erp --env-file .env -f docker-compose.yml ...
# =====================================================================

name: erp

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: erp-backend:latest
    container_name: erp-backend
    network_mode: host
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Flyway is OFF in production: schema changes are applied by hand.
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDLAUTO: none   # = spring.jpa.hibernate.ddl-auto (relaxed binding drops the dash)
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FILE_ACCESS_TOKEN_SECRET: ${FILE_ACCESS_TOKEN_SECRET:?FILE_ACCESS_TOKEN_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      # application-prod.properties requires these placeholders to exist (empty = mail not sent).
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7272/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: erp-frontend:latest
    container_name: erp-frontend
    network_mode: host
    restart: unless-stopped
